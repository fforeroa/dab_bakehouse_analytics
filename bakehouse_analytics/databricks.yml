# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: f24bee41-5925-46e3-ae5a-30340998e66b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse que ejecuta las consultas del dashboard
  

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405614595028831.11.azuredatabricks.net/
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
      warehouse_id: efed62c740eb23f6
  prod:
    mode: production
    workspace:
      host: https://adb-7405613993581251.11.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/fcamifox@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/fcamifox@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prod
      schema: rnd
      warehouse_id: 897a59f49eb2da08
    permissions:
      - user_name: fcamifox@gmail.com
        level: CAN_MANAGE
